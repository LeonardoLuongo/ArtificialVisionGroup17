# FILE: src/Tracker/Yolo12m/soccer_tracker.yaml

tracker_type: botsort
# Rilevamento: Sii severo su CHI inizi a tracciare per evitare 'fantasmi'
track_high_thresh: 0.6
track_low_thresh: 0.1
new_track_thresh: 0.7

# Buffer: Aumentalo drasticamente. 
# Se un giocatore viene coperto o esce per 2 secondi, mantieni il suo ID.
track_buffer: 120        # 4 secondi a 30fps (Era 90)

match_thresh: 0.7        # Soglia generale di abbinamento

# --- CAMERA MOTION COMPENSATION (GMC) ---
gmc_method: sparseOptFlow

# --- BoTSORT SPECIFIC PARAMS ---
# Qui sta il trucco per i 62 ID:

# 1. Aumenta la fiducia nella posizione (IoU/Motion)
proximity_thresh: 0.6    # Diamo più peso alla fisica che all'aspetto

# 2. RILASSA la soglia estetica (Appearance)
# Prima era 0.25 (troppo severo per un modello generico).
# Portandolo a 0.40 o 0.50 dici: "Anche se l'embedding è un po' diverso, uniscili lo stesso".
appearance_thresh: 0.45  # <--- MODIFICA CRITICA per ridurre frammentazione

# --- MODIFICHE RE-ID ---
with_reid: True
# Usa il modello LARGE (scaricalo o lascia che lo scarichi lui).
# È molto più bravo del Medium a distinguere dettagli fini.
model: "yolov8l-cls.pt" 

fuse_score: True
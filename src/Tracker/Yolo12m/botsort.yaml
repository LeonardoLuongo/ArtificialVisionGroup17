
tracker_type: botsort  # Cambiato da bytetrack
track_high_thresh: 0.5 
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90       # Aumentato per gestire meglio le sparizioni temporanee
match_thresh: 0.7      # Leggermente abbassato per essere più flessibile nei movimenti rapidi

# --- CAMERA MOTION COMPENSATION (GMC) ---
gmc_method: sparseOptFlow # Metodo consigliato per il calcio (bilancia velocità e precisione)
# Altre opzioni: 
# 'orb' (veloce ma meno preciso), 
# 'ecc' (molto preciso ma molto lento), 
# 'none' (disattiva la compensazione)

# --- BoTSORT SPECIFIC PARAMS ---
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False       # Lasciamo False per ora: i calciatori sono troppo 
fuse_score: True